<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPS Setter</title>
    
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS Variables for easy customization */
        :root {
            --primary-bg: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Layout Container */
        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
            flex: 1;
        }

        /* Header Section */
        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        /* Responsive Grid System */
        .zone-grid {
            display: grid;
            gap: 20px;
            /* Mobile: 1 col, Tablet: 2 col, Desktop: 4 col */
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            perspective: 1000px;
        }

        /* Premium Card Style */
        .zone-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Glow Effect on Hover */
        .zone-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--x) var(--y), rgba(255,255,255,0.06), transparent 40%);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .zone-card:hover::before {
            opacity: 1;
        }

        .zone-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Icon Container */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: var(--accent-color);
            transition: var(--transition);
            border: 1px solid var(--glass-border);
        }

        .zone-card:hover .icon-wrapper {
            background: var(--accent-color);
            color: white;
            transform: rotateY(360deg);
        }

        .zone-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .zone-status {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Loading Animation */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary-bg);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(56, 189, 248, 0.1);
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Footer */
        footer {
            padding: 30px;
            text-align: center;
            border-top: 1px solid var(--glass-border);
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
        }

        /* Keyframes */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .wrapper { padding: 20px 15px; }
            .zone-grid { grid-template-columns: 1fr 1fr; gap: 12px; } /* Mobile এ ২ কলাম */
            .zone-card { padding: 25px 10px; border-radius: 16px; }
            .icon-wrapper { width: 60px; height: 60px; font-size: 1.5rem; }
            .zone-name { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>GPS SETTER</h1>
            <p>Select your zone</p>
        </header>

        <main class="zone-grid">
            <!-- Ardiya -->
            <a href="ardiya.html" class="zone-card" onclick="showLoader(event, this.href)">
                <div class="icon-wrapper">
                    <i class="fas fa-pizza-slice"></i>
                </div>
                <div class="zone-name">Ardiya</div>
                <div class="zone-status">Zone 01</div>
            </a>

            <!-- Hawally -->
            <a href="hawally.html" class="zone-card" onclick="showLoader(event, this.href)">
                <div class="icon-wrapper" style="color: #fbbf24;">
                    <i class="fas fa-hamburger"></i>
                </div>
                <div class="zone-name">Hawally</div>
                <div class="zone-status">Zone 02</div>
            </a>

            <!-- Sabha Al Salem -->
            <a href="salem.html" class="zone-card" onclick="showLoader(event, this.href)">
                <div class="icon-wrapper" style="color: #10b981;">
                    <i class="fas fa-coffee"></i>
                </div>
                <div class="zone-name">Sabha Salem</div>
                <div class="zone-status">Zone 03</div>
            </a>

            <!-- Al Jahrah -->
            <a href="jahra.html" class="zone-card" onclick="showLoader(event, this.href)">
                <div class="icon-wrapper" style="color: #ec4899;">
                    <i class="fas fa-fish"></i>
                </div>
                <div class="zone-name">Al Jahrah</div>
                <div class="zone-status">Zone 04</div>
            </a>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 Powered by <a href="https://github.com/Android1500/GpsSetter">|  Gps Setter</a></p>
    </footer>

    <!-- Loading Overlay -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p style="margin-top: 15px; letter-spacing: 2px;">Please Wait...</p>
    </div>

    <script>
        // কার্ডের ওপর মাউস নাড়াচাড়া করলে লাইটিং ইফেক্ট (Desktop এর জন্য)
        document.querySelectorAll('.zone-card').forEach(card => {
            card.onmousemove = e => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--x', `${x}px`);
                card.style.setProperty('--y', `${y}px`);
            };
        });

        // পেজ ট্রানজিশন লোডার
        function showLoader(event, url) {
            event.preventDefault();
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            
            // মোবাইল ভাইব্রেশন (যদি সাপোর্ট করে)
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            setTimeout(() => {
                window.location.href = url;
            }, 800);
        }
    </script>
</body>
</html>
