<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gps Setter</title>
    
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #00ff88;
            --primary-green-rgb: 0, 255, 136;
            --deep-green: #052c1e;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-color: #e0fff0;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-sm: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 15px 40px rgba(var(--primary-green-rgb), 0.2);
            
            /* Dynamic colors will be set via JS */
            --dynamic-color-1: 0, 255, 136;
            --dynamic-color-2: 0, 168, 107;
            --dynamic-color-3: 57, 255, 20;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            opacity: 1;
            animation: fadeIn 0.5s ease;
            position: relative;
            background: #020d0a; /* Fallback */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Dynamic Background Canvas */
        #dynamic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            display: block;
        }

        /* Animated orbs layer */
        .bg-visuals {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
            will-change: transform;
            transition: background-color 3s ease;
        }

        .orb-1 { 
            width: min(500px, 80vw); 
            height: min(500px, 80vw); 
            top: -10%; 
            left: -10%; 
            background: rgba(var(--dynamic-color-1), 0.6);
        }
        
        .orb-2 { 
            width: min(400px, 70vw); 
            height: min(400px, 70vw); 
            bottom: -10%; 
            right: -10%; 
            animation-delay: -5s;
            background: rgba(var(--dynamic-color-2), 0.6);
        }
        
        .orb-3 { 
            width: min(350px, 60vw); 
            height: min(350px, 60vw); 
            top: 40%; 
            left: 60%; 
            animation-delay: -10s;
            background: rgba(var(--dynamic-color-3), 0.6);
        }
        
        .orb-4 { 
            width: min(300px, 50vw); 
            height: min(300px, 50vw); 
            top: 60%; 
            left: 20%; 
            animation-delay: -3s;
            background: rgba(var(--dynamic-color-1), 0.5);
        }
        
        .orb-5 { 
            width: min(450px, 75vw); 
            height: min(450px, 75vw); 
            top: 20%; 
            right: 15%; 
            animation-delay: -7s;
            background: rgba(var(--dynamic-color-2), 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2%, 4%) scale(1.1); }
        }

        /* Header */
        .header {
            text-align: center;
            padding: clamp(30px, 8vw, 50px) 20px 30px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: clamp(2rem, 6vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, var(--primary-green));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            opacity: 0.9;
            font-weight: 400;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Main container */
        .main-container {
            flex: 1;
            padding: 20px;
            max-width: min(600px, 95%);
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
            gap: 20px;
        }

        /* Glass button */
        .premium-btn {
            position: relative;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: clamp(20px, 5vw, 30px) 15px;
            cursor: pointer;
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            color: inherit;
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
            text-decoration: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .premium-btn:focus-visible {
            outline: 3px solid var(--primary-green);
            outline-offset: 3px;
        }

        .premium-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .premium-btn:active {
            transform: scale(0.97);
        }

        @media (hover: none) {
            .premium-btn:hover {
                transform: none;
            }
        }

        .icon-box {
            width: min(65px, 15vw);
            height: min(65px, 15vw);
            background: rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.5rem, 5vw, 2rem);
            color: white;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .premium-btn:hover .icon-box {
            background: var(--primary-green);
            color: #000;
            transform: rotate(8deg) scale(1.05);
            box-shadow: 0 0 30px var(--primary-green);
        }

        .zone-label {
            font-weight: 600;
            font-size: clamp(0.9rem, 3vw, 1rem);
            color: #fff;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        /* Loader */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 13, 10, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            will-change: transform;
        }

        .loader-text {
            margin-top: 20px;
            font-size: 1rem;
            color: white;
            text-align: center;
            opacity: 0.9;
        }

        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }

        /* Footer */
        .footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
            display: inline-block;
            padding: 5px 10px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .footer a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .footer i {
            color: #ff4d4d;
            margin: 0 2px;
        }

        /* Color indicator (optional - remove if not wanted) */
        .color-indicator {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(5px);
            z-index: 100;
            opacity: 0.5;
            pointer-events: none;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 400px) {
            .button-grid { 
                grid-template-columns: 1fr; 
            }
            
            .premium-btn {
                flex-direction: row;
                justify-content: center;
                padding: 15px;
            }
            
            .icon-box {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .header {
                padding: 20px;
            }
            
            .button-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- Dynamic Canvas Background -->
    <canvas id="dynamic-bg"></canvas>

    <!-- Animated Orbs Layer -->
    <div class="bg-visuals" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
    </div>

    <header class="header">
        <h1>Select Your Zone</h1>
        <p>And get more better experience</p>
    </header>

    <main class="main-container">
        <div class="button-grid" role="list">
            <button class="premium-btn" onclick="navigateTo('ardiya.html')" aria-label="Navigate to Ardiya Zone">
                <span class="icon-box" aria-hidden="true"><i class="fas fa-pizza-slice"></i></span>
                <span class="zone-label">Ardiya Zone</span>
            </button>
            
            <button class="premium-btn" onclick="navigateTo('hawally.html')" aria-label="Navigate to Hawally Zone">
                <span class="icon-box" aria-hidden="true"><i class="fas fa-hamburger"></i></span>
                <span class="zone-label">Hawally Zone</span>
            </button>
            
            <button class="premium-btn" onclick="navigateTo('salem.html')" aria-label="Navigate to Sabha Al Salem Zone">
                <span class="icon-box" aria-hidden="true"><i class="fas fa-coffee"></i></span>
                <span class="zone-label">Sabha Al Salem</span>
            </button>
            
            <button class="premium-btn" onclick="navigateTo('jahra.html')" aria-label="Navigate to Al Jahrah Zone">
                <span class="icon-box" aria-hidden="true"><i class="fas fa-fish"></i></span>
                <span class="zone-label">Al Jahrah Zone</span>
            </button>
        </div>
    </main>

    <footer class="footer">
        <p>Powered by<i class="fas fa-heart" aria-hidden="true"></i></p>
        <a href="https://github.com/Android1500/GpsSetter" target="_blank" rel="noopener noreferrer">
            GPS SETTER PREMIUM
        </a>
    </footer>

    <div class="loading-overlay" id="loader" role="alert" aria-live="assertive">
        <div>
            <div class="loader"></div>
            <div class="loader-text">Loading Zone...</div>
        </div>
    </div>

    <!-- Optional: Color indicator (remove if not needed) -->
    <div class="color-indicator" id="colorIndicator">Color: <span id="colorName">Green</span></div>

    <script>
        (function() {
            'use strict';
            
            // Cache DOM elements
            const loader = document.getElementById('loader');
            let navigationTimeout;

            // Navigation function
            window.navigateTo = function(url) {
                if (!url || typeof url !== 'string') {
                    console.error('Invalid navigation URL');
                    return;
                }

                if (navigationTimeout) {
                    clearTimeout(navigationTimeout);
                }

                loader.style.display = 'flex';
                loader.offsetHeight;
                loader.classList.add('active');

                try {
                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(30);
                    }
                } catch (e) {}

                navigationTimeout = setTimeout(() => {
                    window.location.href = url;
                }, 600);
            };

            // Dynamic Background System
            const canvas = document.getElementById('dynamic-bg');
            const ctx = canvas.getContext('2d');
            const colorIndicator = document.getElementById('colorName');
            
            // Color palettes for dynamic changes
            const colorPalettes = [
                { name: 'Green', primary: [0, 255, 136], secondary: [0, 168, 107], tertiary: [57, 255, 20] },
                { name: 'Blue', primary: [0, 150, 255], secondary: [0, 100, 200], tertiary: [100, 200, 255] },
                { name: 'Purple', primary: [180, 0, 255], secondary: [120, 0, 200], tertiary: [200, 100, 255] },
                { name: 'Pink', primary: [255, 50, 150], secondary: [200, 0, 100], tertiary: [255, 100, 200] },
                { name: 'Orange', primary: [255, 150, 0], secondary: [200, 100, 0], tertiary: [255, 200, 50] },
                { name: 'Cyan', primary: [0, 255, 200], secondary: [0, 200, 150], tertiary: [50, 255, 220] },
                { name: 'Red', primary: [255, 50, 50], secondary: [200, 0, 0], tertiary: [255, 100, 100] },
                { name: 'Yellow', primary: [255, 255, 0], secondary: [200, 200, 0], tertiary: [255, 255, 100] },
                { name: 'Mint', primary: [100, 255, 150], secondary: [50, 200, 100], tertiary: [150, 255, 200] },
                { name: 'Lavender', primary: [200, 150, 255], secondary: [150, 100, 200], tertiary: [230, 200, 255] }
            ];

            let currentPaletteIndex = 0;
            let nextPaletteIndex = 1;
            let transitionProgress = 0;
            const transitionSpeed = 0.002; // How fast colors change (lower = slower)
            
            // Particles for canvas effect
            let particles = [];
            const particleCount = 50;

            // Initialize particles
            function initParticles() {
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        radius: Math.random() * 3 + 1,
                        speedX: (Math.random() - 0.5) * 0.5,
                        speedY: (Math.random() - 0.5) * 0.5,
                        opacity: Math.random() * 0.5 + 0.2
                    });
                }
            }

            // Resize canvas
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            // Update CSS variables for orbs
            function updateOrbColors(primary, secondary, tertiary) {
                document.documentElement.style.setProperty('--dynamic-color-1', primary.join(','));
                document.documentElement.style.setProperty('--dynamic-color-2', secondary.join(','));
                document.documentElement.style.setProperty('--dynamic-color-3', tertiary.join(','));
                
                if (colorIndicator) {
                    const palette = colorPalettes[currentPaletteIndex];
                    colorIndicator.textContent = palette.name;
                }
            }

            // Interpolate between two colors
            function interpolateColor(color1, color2, progress) {
                return [
                    Math.round(color1[0] + (color2[0] - color1[0]) * progress),
                    Math.round(color1[1] + (color2[1] - color1[1]) * progress),
                    Math.round(color1[2] + (color2[2] - color1[2]) * progress)
                ];
            }

            // Draw canvas background
            function drawCanvas() {
                if (!ctx) return;

                // Clear canvas with slight transparency for trail effect
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Get current colors with transition
                const currentPalette = colorPalettes[currentPaletteIndex];
                const nextPalette = colorPalettes[nextPaletteIndex];
                
                const primary = interpolateColor(currentPalette.primary, nextPalette.primary, transitionProgress);
                const secondary = interpolateColor(currentPalette.secondary, nextPalette.secondary, transitionProgress);
                const tertiary = interpolateColor(currentPalette.tertiary, nextPalette.tertiary, transitionProgress);

                // Update orb colors
                updateOrbColors(primary, secondary, tertiary);

                // Create gradient background
                const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                gradient.addColorStop(0, `rgba(${primary[0]}, ${primary[1]}, ${primary[2]}, 0.1)`);
                gradient.addColorStop(0.5, `rgba(${secondary[0]}, ${secondary[1]}, ${secondary[2]}, 0.1)`);
                gradient.addColorStop(1, `rgba(${tertiary[0]}, ${tertiary[1]}, ${tertiary[2]}, 0.1)`);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw particles
                particles.forEach(particle => {
                    // Update particle position
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;

                    // Wrap around screen
                    if (particle.x < 0) particle.x = canvas.width;
                    if (particle.x > canvas.width) particle.x = 0;
                    if (particle.y < 0) particle.y = canvas.height;
                    if (particle.y > canvas.height) particle.y = 0;

                    // Draw particle
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    
                    // Color particle based on current primary color
                    const color = interpolateColor(primary, secondary, Math.random());
                    ctx.fillStyle = `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${particle.opacity})`;
                    ctx.fill();
                });

                // Update transition progress
                transitionProgress += transitionSpeed;
                
                if (transitionProgress >= 1) {
                    transitionProgress = 0;
                    currentPaletteIndex = nextPaletteIndex;
                    nextPaletteIndex = (nextPaletteIndex + 1) % colorPalettes.length;
                }

                requestAnimationFrame(drawCanvas);
            }

            // Initialize
            window.addEventListener('load', () => {
                resizeCanvas();
                initParticles();
                drawCanvas();
            });

            window.addEventListener('resize', () => {
                resizeCanvas();
                // Reinitialize particles for new screen size
                particles = [];
                initParticles();
            });

            // Handle page visibility
            document.addEventListener('visibilitychange', function() {
                if (document.hidden && navigationTimeout) {
                    clearTimeout(navigationTimeout);
                }
            });

            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    if (loader) {
                        loader.style.display = 'none';
                        loader.classList.remove('active');
                    }
                }
            });

            // Preload first zone
            if (window.requestIdleCallback) {
                requestIdleCallback(() => {
                    const link = document.createElement('link');
                    link.rel = 'prefetch';
                    link.href = 'ardiya.html';
                    document.head.appendChild(link);
                });
            }

        })();
    </script>

    <noscript>
        <div style="position:fixed; bottom:20px; left:20px; right:20px; background:#ff4444; color:white; padding:15px; text-align:center; border-radius:10px; z-index:10000;">
            Please enable JavaScript for the best experience
        </div>
    </noscript>
</body>
</html>
